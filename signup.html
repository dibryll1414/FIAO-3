<main><form class="card auth" id="signup">
<h1>Sign up</h1><p class="sub">Create your account and start replacing the paper ledger.</p>
<label for="name">Your name or store</label><input id="name" required placeholder="Minisúper Doña Chela">
<label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required autocomplete="email">
<label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
<label for="pw2">Repeat password</label><input id="pw2" type="password" required>
<p class="msg" id="msg" role="alert"></p>
<button class="send">Create account</button>
<p class="alt">Already have an account? <a href="login.html">Log in</a></p>
</form></main><script src="auth.js"></script></body></html>
